[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.24"
optimizer      = true
optimizer_runs = 200


remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[profile.ci]
fuzz = { runs = 1000 }


[rpc_endpoints]
localhost  = "http://127.0.0.1:8545"
flowroll   = "http://127.0.0.1:8545"
testnet    = "https://jsonrpc-evm-1.anvil.asia-southeast.initia.xyz"

[fmt]
line_length = 100
tab_width   = 4
